<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SPARK</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #08070c;
}
canvas {
  display: block;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}


#fade-overlay {
  position: fixed;
  inset: 0;
  background: #08070c;
  opacity: 0;
  pointer-events: none;
  z-index: 9;
  transition: opacity 0.55s cubic-bezier(0.4,0,1,1);
}
#fade-overlay.active { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fade-overlay"></div>
<script>
'use strict';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, CX, CY, PR;

const isMobile = /Mobi|Android/i.test(navigator.userAgent) || window.innerWidth < 768;

function resize() {
  PR = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
  W  = window.innerWidth;
  H  = window.innerHeight;
  canvas.width  = Math.round(W * PR);
  canvas.height = Math.round(H * PR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(PR, PR);
  CX = W / 2;
  CY = H / 2;
}
resize();
window.addEventListener('resize', () => { resize(); });

/* ─────────────────────────────────────
   УТИЛИТЫ
───────────────────────────────────── */
const clamp  = (v,a,b) => Math.max(a, Math.min(b,v));
const prog   = (t,a,b) => clamp((t-a)/(b-a), 0, 1);
const lerp   = (a,b,t) => a + (b-a)*t;
const eOut   = (t,p=3) => 1 - Math.pow(1-t, p);
const eIn    = (t,p=3) => Math.pow(t, p);
const eInOut = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ─────────────────────────────────────
   SCANLINE SWEEP — отключён
───────────────────────────────────── */
function drawScanlineSweep(now, globalA) { /* убран по запросу */ }

/* ─────────────────────────────────────
   GRAIN — статичный шум на отдельном canvas
   Обновляется каждые ~3 кадра для cinematic
   feel без лишней нагрузки
───────────────────────────────────── */
/* grain удалён */

/* ─────────────────────────────────────
   ТОЧЕЧНАЯ СЕТКА — фоновая текстура
   Появляется вместе со scan-line,
   держится весь интро. Очень тихая.
───────────────────────────────────── */
let dotGrid = [];

function buildDotGrid() {
  dotGrid = [];
  const s    = Math.min(W, H);
  const step = s * 0.072;      // шаг сетки
  const cols = Math.ceil(W / step) + 2;
  const rows = Math.ceil(H / step) + 2;
  const offX = (W - (cols - 1) * step) / 2;
  const offY = (H - (rows - 1) * step) / 2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      dotGrid.push({
        x: offX + c * step,
        y: offY + r * step,
      });
    }
  }
}
buildDotGrid();
window.addEventListener('resize', () => { resize(); setupGrain(); buildDotGrid(); });

function drawDotGrid(now, globalA) {
  if (isMobile) return;  // отключено на мобильных
  // Появляется за 0.6s с начала, держится весь ролик
  const fadeIn = eOut(prog(now, 0, 0.6), 2);
  const a = fadeIn * globalA * 0.09;   // максимум 9% — почти невидима
  if (a < 0.004) return;

  const s    = Math.min(W, H);
  const r    = Math.max(0.8, s * 0.0018);   // радиус точки

  ctx.save();
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  for (const d of dotGrid) {
    ctx.beginPath();
    ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

/* ─────────────────────────────────────
   RIPPLE-ВОЛНЫ
   При рождении диска из линии — 3 кольца
   расходятся от точки подъёма, угасают
───────────────────────────────────── */
const ripples = [];
let rippleSpawned = false;

function spawnRipples(x, y, r) {
  // 3 волны с задержкой
  for (let i = 0; i < 3; i++) {
    ripples.push({
      x, y,
      born: 0,        // заполняется в момент добавления
      delay: i * 0.13,
      maxR:  r * (3.5 + i * 2.2),
      baseR: r,
      spawned: false,
    });
  }
}

function drawRipples(now, globalA) {
  if (!ripples.length) return;
  ctx.save();
  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    if (!rp.born) rp.born = now;
    const age = now - rp.born - rp.delay;
    if (age < 0) continue;

    const t  = Math.min(age / 0.85, 1);   // 0.85s — время жизни
    const cr = lerp(rp.baseR * 0.5, rp.maxR, eOut(t, 2));
    const a  = (1 - eIn(t, 2)) * 0.22 * globalA;
    if (a < 0.005) { if (t >= 1) ripples.splice(i, 1); continue; }

    // Градиент кольца: золото → розовый → фиолетовый
    const grad = ctx.createRadialGradient(rp.x, rp.y, cr * 0.88, rp.x, rp.y, cr);
    grad.addColorStop(0,   `rgba(255,180,  0, 0)`);
    grad.addColorStop(0.4, `rgba(255,180,  0, ${a})`);
    grad.addColorStop(0.7, `rgba(240, 20,140, ${a * 0.7})`);
    grad.addColorStop(1,   `rgba(120, 20,255, 0)`);

    ctx.beginPath();
    ctx.arc(rp.x, rp.y, cr, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,170,0,${a})`;
    ctx.lineWidth   = Math.max(0.5, rp.baseR * 0.04 * (1 - t));
    if (!isMobile) {
      ctx.shadowColor = `rgba(255,170,0,${a * 0.7})`;
      ctx.shadowBlur  = rp.baseR * 0.5;
    }
    ctx.stroke();
    ctx.shadowBlur  = 0;

    if (t >= 1) ripples.splice(i, 1);
  }
  ctx.restore();
}

/* ─────────────────────────────────────
   ORBIT ARC + SPARK
   Когда диск встаёт на финальную позицию
   (moveP → 1), вокруг него описывается
   золотая дуга. На конце дуги — яркая
   искра-блик. Затем всё быстро гаснет.

   DRAW_START = момент когда moveP = 1
   ARC_DUR    = время описания полного круга
   FADE_DUR   = время угасания после
───────────────────────────────────── */
const ARC_DUR   = 1.1;    // секунды на полный оборот
const ARC_HOLD  = 0.12;   // пауза после завершения дуги до искры
const ARC_FADE  = 0.45;   // угасание дуги (идёт параллельно с искрой)
const SPARK_DUR = 0.55;   // время жизни искры

// Искра — 45° верхний правый (от 12 часов по часовой)
const SPARK_ANG = -Math.PI / 2 + Math.PI / 4;

function drawOrbitArc(x, y, r, orbTime, globalA) {
  if (orbTime < 0) return;

  // Полная длительность: дуга + пауза + искра (дуга угасает параллельно с искрой)
  const totalDur = ARC_DUR + ARC_HOLD + SPARK_DUR;
  if (orbTime >= totalDur) return;

  // Дуга вплотную к краю диска (небольшой отступ = половина lineWidth)
  const lw   = Math.max(0.8, r * 0.04);
  const arcR = r + lw * 0.5;   // прямо по контуру

  // ФАЗА 1 — рисование дуги [0 .. ARC_DUR]
  const drawT = Math.min(orbTime / ARC_DUR, 1);

  // ФАЗА 2 — дуга угасает [ARC_DUR+ARC_HOLD .. ARC_DUR+ARC_HOLD+ARC_FADE]
  const fadeSt  = ARC_DUR + ARC_HOLD;
  const fadeT   = orbTime > fadeSt
    ? Math.min((orbTime - fadeSt) / ARC_FADE, 1)
    : 0;
  const arcAlpha = (1 - eIn(fadeT, 2)) * globalA;

  // ФАЗА 3 — искра [ARC_DUR+ARC_HOLD .. totalDur]
  const sparkT = orbTime > fadeSt
    ? Math.min((orbTime - fadeSt) / SPARK_DUR, 1)
    : 0;
  const sparkA = sparkT < 0.2
    ? eOut(sparkT / 0.2, 2)
    : eIn(1 - (sparkT - 0.2) / 0.8, 1.6);
  const sparkAlpha = sparkA * globalA;

  ctx.save();

  // ── Дуга ──
  if (arcAlpha > 0.005) {
    const startAng = -Math.PI / 2;
    const endAng   = startAng + Math.PI * 2 * eOut(drawT, 2);

    ctx.beginPath();
    ctx.arc(x, y, arcR, startAng, endAng, false);
    ctx.strokeStyle = `rgba(255, 210, 80, ${arcAlpha * 0.75})`;
    ctx.lineWidth   = lw;
    ctx.lineCap     = 'round';
    if (!isMobile) {
      ctx.shadowColor = `rgba(255, 190, 40, ${arcAlpha * 0.9})`;
      ctx.shadowBlur  = lw * 6;
    }
    ctx.stroke();
    ctx.shadowBlur  = 0;

    // Тонкий хвост у начала
    if (drawT > 0.15) {
      const tailLen = Math.min(drawT, 0.35) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(x, y, arcR, startAng, startAng + tailLen * 0.4, false);
      ctx.strokeStyle = `rgba(255, 210, 80, ${arcAlpha * 0.08})`;
      ctx.lineWidth   = lw * 0.6;
      ctx.stroke();
    }
  }

  // ── Искра (фаза 3) ──
  if (sparkAlpha > 0.005) {
    const sx = x + Math.cos(SPARK_ANG) * arcR;
    const sy = y + Math.sin(SPARK_ANG) * arcR;

    if (!isMobile) {
      // Дальний широкий ореол — только десктоп
      const outerGlow = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 1.1);
      outerGlow.addColorStop(0,   `rgba(255, 255, 200, ${sparkAlpha * 0.55})`);
      outerGlow.addColorStop(0.3, `rgba(255, 200,  60, ${sparkAlpha * 0.28})`);
      outerGlow.addColorStop(0.7, `rgba(255, 100, 180, ${sparkAlpha * 0.08})`);
      outerGlow.addColorStop(1,   `rgba(0, 0, 0, 0)`);
      ctx.fillStyle = outerGlow;
      ctx.beginPath();
      ctx.arc(sx, sy, r * 1.1, 0, Math.PI * 2);
      ctx.fill();
    }

    // Ближний ореол
    const innerGlow = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 0.5);
    innerGlow.addColorStop(0,   `rgba(255, 255, 240, ${sparkAlpha * 0.95})`);
    innerGlow.addColorStop(0.4, `rgba(255, 220,  80, ${sparkAlpha * 0.65})`);
    innerGlow.addColorStop(1,   `rgba(255, 150,  50, 0)`);
    ctx.fillStyle = innerGlow;
    ctx.beginPath();
    ctx.arc(sx, sy, r * 0.5, 0, Math.PI * 2);
    ctx.fill();

    // Белое ядро
    ctx.beginPath();
    ctx.arc(sx, sy, lw * 1.8, 0, Math.PI * 2);
    ctx.fillStyle   = `rgba(255, 255, 255, ${sparkAlpha})`;
    if (!isMobile) {
      ctx.shadowColor = `rgba(255, 240, 120, ${sparkAlpha})`;
      ctx.shadowBlur  = lw * 14;
    }
    ctx.fill();
    ctx.shadowBlur  = 0;

    // 4 луча с градиентом
    const rayLen = r * 0.55 * sparkAlpha;
    for (let i = 0; i < 4; i++) {
      const ang  = (i / 4) * Math.PI * 2;
      const grad = ctx.createLinearGradient(
        sx, sy,
        sx + Math.cos(ang) * rayLen, sy + Math.sin(ang) * rayLen
      );
      grad.addColorStop(0, `rgba(255, 255, 200, ${sparkAlpha * 0.9})`);
      grad.addColorStop(1, `rgba(255, 200,  60, 0)`);
      ctx.beginPath();
      ctx.moveTo(sx + Math.cos(ang) * lw * 2, sy + Math.sin(ang) * lw * 2);
      ctx.lineTo(sx + Math.cos(ang) * rayLen,  sy + Math.sin(ang) * rayLen);
      ctx.strokeStyle = grad;
      ctx.lineWidth   = Math.max(0.6, lw * 0.5);
      ctx.lineCap     = 'round';
      ctx.stroke();
    }
  }

  ctx.restore();
}

/* ─────────────────────────────────────
   УГЛОВЫЕ ЗАСЕЧКИ (corner marks)
   4 тонких уголка в углах экрана —
   появляются при HOLD, как viewfinder
───────────────────────────────────── */
function drawCornerMarks(now, globalA) {
  const t = prog(now, T.STAR_MOVE_END, T.HOLD_END);
  if (t <= 0) return;
  const a = eOut(t, 3) * globalA * 0.22;

  const s = Math.min(W, H) * 0.04;  // длина засечки
  const m = Math.min(W, H) * 0.05;  // отступ от края
  const lw = Math.max(0.5, Math.min(W, H) * 0.001);

  const corners = [
    [m,       m,       1,  1],
    [W - m,   m,      -1,  1],
    [m,       H - m,   1, -1],
    [W - m,   H - m,  -1, -1],
  ];

  ctx.save();
  ctx.strokeStyle = `rgba(255,255,255,${a})`;
  ctx.lineWidth   = lw;
  ctx.lineCap     = 'square';

  for (const [cx, cy, dx, dy] of corners) {
    ctx.beginPath();
    ctx.moveTo(cx + dx * s, cy);
    ctx.lineTo(cx,           cy);
    ctx.lineTo(cx,           cy + dy * s);
    ctx.stroke();
  }
  ctx.restore();
}

/* ─────────────────────────────────────
   TAGLINE — едва видимая подпись
   появляется под логотипом на HOLD
───────────────────────────────────── */
function drawTagline(p, now, globalA) {
  const t = prog(now, T.STAR_MOVE_END + 0.15, T.HOLD_END);
  if (t <= 0) return;
  const a = eOut(t, 4) * globalA * 0.52;

  const s   = Math.min(W, H);
  const fs  = s * 0.018;
  const y   = p.lineY + p.lineThick * 6 + fs;

  ctx.save();
  ctx.font          = `300 ${fs}px 'Helvetica Neue',Helvetica,Arial,sans-serif`;
  ctx.textAlign     = 'center';
  ctx.textBaseline  = 'middle';
  ctx.letterSpacing = `${fs * 0.38}px`;
  ctx.fillStyle     = `rgba(255,255,255,${a})`;
  ctx.fillText('LIGHT UP THE FUTURE', CX, y);

  // Декоративные черточки по бокам — как в люксовых брендах
  const textMetrics = ctx.measureText('LIGHT UP THE FUTURE');
  // Приблизительная ширина с letter-spacing
  const tw = textMetrics.width + fs * 0.38 * 18;
  const dashW   = Math.min(W * 0.04, tw * 0.28);
  const dashGap = fs * 0.9;
  const lw2 = Math.max(0.3, fs * 0.04);
  ctx.strokeStyle = `rgba(255,255,255,${a * 0.55})`;
  ctx.lineWidth   = lw2;
  ctx.lineCap     = 'round';
  // Левая черта
  ctx.beginPath();
  ctx.moveTo(CX - tw * 0.5 - dashGap - dashW, y);
  ctx.lineTo(CX - tw * 0.5 - dashGap,         y);
  ctx.stroke();
  // Правая черта
  ctx.beginPath();
  ctx.moveTo(CX + tw * 0.5 + dashGap,         y);
  ctx.lineTo(CX + tw * 0.5 + dashGap + dashW, y);
  ctx.stroke();

  ctx.restore();
}

/* ─────────────────────────────────────
   ТАЙМИНГИ (секунды, всего ~4.0)

   0.00 – 0.55  LINE_IN    линия раскрывается
   0.55 – 1.00  LINE_WAIT  линия дышит
   1.00 – 1.55  STAR_RISE  сфера поднимается из центра линии
   1.55 – 2.80  STAR_MOVE  сфера едет влево, текст вытекает вправо
   2.80 – 3.40  HOLD       финальная композиция стоит
   3.40 – 4.00  FADE       всё уходит
───────────────────────────────────── */
const T = {
  LINE_IN_END   : 0.55,
  LINE_WAIT_END : 1.00,
  STAR_RISE_END : 1.55,
  STAR_MOVE_END : 2.80,
  HOLD_END      : 5.40,
  FADE_END      : 6.00,
};

/* ─────────────────────────────────────
   АДАПТИВНЫЕ ПАРАМЕТРЫ
───────────────────────────────────── */
function P() {
  const s    = Math.min(W, H);
  const ball = s * 0.072;          // радиус сферы

  // Финальная позиция сферы — слева от центра слова
  // Слово "SPARK" ~ fontSize * 3.6 в ширину
  const fontSize = s * 0.115;
  const wordW    = fontSize * 3.65;
  const gap      = ball * 0.6;     // зазор между сферой и текстом

  // Весь логотип (сфера + зазор + слово) центрируем по X
  const totalW   = ball * 2 + gap + wordW;
  const logoLeft = CX - totalW / 2;

  // Y логотипа — чуть выше центра
  const logoY    = CY - s * 0.02;

  return {
    ball,
    fontSize,
    wordW,
    gap,
    totalW,

    // Финальная X сферы (левый центр логотипа + радиус)
    ballFinalX : logoLeft + ball,
    ballY      : logoY,

    // Старт сферы — по центру экрана
    ballStartX : CX,
    ballStartY : logoY,

    // Текст начинается сразу правее сферы
    textX      : logoLeft + ball * 2 + gap,
    textY      : logoY,

    // Линия — под логотипом
    lineY      : logoY + ball * 1.38,
    lineLen    : totalW * 0.92,   // чуть уже логотипа
    lineThick  : Math.max(1.5, s * 0.004),
    lineCX     : CX,
  };
}

/* ─────────────────────────────────────
   РИСУЕМ ЛИНИЮ с заострёнными концами
───────────────────────────────────── */
function drawLine(cx, cy, halfLen, thick, alpha) {
  if (alpha < 0.002 || halfLen < 1) return;
  ctx.save();

  const body = halfLen * 0.75;
  const h    = thick / 2;

  ctx.beginPath();
  ctx.moveTo(cx - halfLen, cy);
  ctx.lineTo(cx - body,    cy - h);
  ctx.lineTo(cx + body,    cy - h);
  ctx.lineTo(cx + halfLen, cy);
  ctx.lineTo(cx + body,    cy + h);
  ctx.lineTo(cx - body,    cy + h);
  ctx.closePath();

  const gr = ctx.createLinearGradient(cx - halfLen, 0, cx + halfLen, 0);
  gr.addColorStop(0,    `rgba(120, 30,255,0)`);
  gr.addColorStop(0.15, `rgba(120, 30,255,${alpha})`);
  gr.addColorStop(0.48, `rgba(255,170,  0,${alpha})`);
  gr.addColorStop(0.80, `rgba(240, 30,130,${alpha})`);
  gr.addColorStop(1,    `rgba(240, 30,130,0)`);

  // Тень под линией (смещённая вниз) — только на десктопе
  if (!isMobile) {
    ctx.save();
    ctx.filter = `blur(${thick * 2.5}px)`;
    ctx.fillStyle = `rgba(200, 80, 180, ${alpha * 0.35})`;
    ctx.beginPath();
    ctx.ellipse(cx, cy + thick * 2.5, halfLen * 0.7, thick * 1.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.filter = 'none';
    ctx.restore();
    ctx.shadowColor = `rgba(255,140,0,${alpha * 0.85})`;
    ctx.shadowBlur  = thick * 10;
  }
  ctx.fillStyle   = gr;
  ctx.fill();
  ctx.restore();
}

/* ─────────────────────────────────────
   РИСУЕМ 2D-ДИСК — плоский, badge-стиль
   Линейный градиент слева-направо (как на
   логотипной иконке), тень снизу-справа,
   мягкое внешнее свечение
───────────────────────────────────── */
function drawBall(x, y, r, alpha) {
  if (alpha < 0.002) return;
  ctx.save();
  ctx.globalAlpha = alpha;

  // 1. Рассеянная тень под диском — только на десктопе
  if (!isMobile) {
    const shadowOX = r * 0.28;
    const shadowOY = r * 0.35;
    const shadowBlurR = r * 1.6;
    const shadowGrad = ctx.createRadialGradient(
      x + shadowOX, y + shadowOY, 0,
      x + shadowOX, y + shadowOY, shadowBlurR
    );
    shadowGrad.addColorStop(0,   `rgba(80, 0, 80, 0.55)`);
    shadowGrad.addColorStop(0.5, `rgba(40, 0, 60, 0.22)`);
    shadowGrad.addColorStop(1,   `rgba(0, 0, 0, 0)`);
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.ellipse(x + shadowOX, y + shadowOY + r * 0.15, r * 1.25, r * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // 2. Внешнее мягкое цветное свечение — только на десктопе
  if (!isMobile) {
    const glow = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 2.2);
    glow.addColorStop(0,   `rgba(255,170,  0, 0.42)`);
    glow.addColorStop(0.4, `rgba(240, 30,140, 0.20)`);
    glow.addColorStop(0.8, `rgba(120, 30,255, 0.07)`);
    glow.addColorStop(1,   `rgba(0,0,0,0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, r * 2.2, 0, Math.PI * 2);
    ctx.fill();
  }

  // 3. Основное тело диска — плоский линейный градиент
  const body = ctx.createLinearGradient(x - r, y - r * 0.3, x + r, y + r * 0.3);
  body.addColorStop(0,    `rgba(255,215, 30, 1)`);
  body.addColorStop(0.38, `rgba(255,100,  0, 1)`);
  body.addColorStop(0.68, `rgba(240, 30,130, 1)`);
  body.addColorStop(1,    `rgba(120, 30,255, 1)`);

  if (!isMobile) {
    ctx.shadowColor = `rgba(220, 40, 180, 0.75)`;
    ctx.shadowBlur  = r * 1.4;
  }
  ctx.fillStyle   = body;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 4. Тонкая полупрозрачная обводка — верхняя дуга светлее
  const stroke = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
  stroke.addColorStop(0,   `rgba(255,255,200, 0.55)`);
  stroke.addColorStop(0.5, `rgba(255,180,100, 0.18)`);
  stroke.addColorStop(1,   `rgba(100, 40,160, 0.06)`);
  ctx.strokeStyle = stroke;
  ctx.lineWidth   = Math.max(1, r * 0.055);
  ctx.beginPath();
  ctx.arc(x, y, r - ctx.lineWidth * 0.5, 0, Math.PI * 2);
  ctx.stroke();

  // 5. Тонкий световой серп сверху (плоский highlight, не объёмный)
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.clip();
  const crescent = ctx.createLinearGradient(x - r, y - r, x, y - r * 0.1);
  crescent.addColorStop(0,   `rgba(255,255,255, 0.22)`);
  crescent.addColorStop(0.6, `rgba(255,255,255, 0.06)`);
  crescent.addColorStop(1,   `rgba(255,255,255, 0)`);
  ctx.fillStyle = crescent;
  ctx.fillRect(x - r, y - r, r * 2, r);
  ctx.restore();

  ctx.restore();
}

/* ─────────────────────────────────────
   РИСУЕМ ТЕКСТ SPARK
   Буквы вытекают вправо из позиции
   правого края сферы по мере движения.

   moveP [0..1] — прогресс движения сферы.
   При moveP=0 сфера в центре, буквы скрыты.
   При moveP=1 сфера на финальной позиции,
   все буквы видны.
───────────────────────────────────── */
const LETTERS = ['S','P','A','R','K'];

function drawText(ballX, ballR, textX, textY, fontSize, moveP, alpha) {
  if (alpha < 0.002) return;
  ctx.save();

  ctx.font         = `900 ${fontSize}px 'Arial Black','Helvetica Neue',Arial,sans-serif`;
  ctx.textAlign    = 'left';
  ctx.textBaseline = 'middle';

  // Ширина одной буквы (приблизительно)
  const letterW = fontSize * 0.73;

  LETTERS.forEach((ch, i) => {
    const lx = textX + i * letterW;

    // Буква i становится видна когда правый край сферы
    // проходит мимо позиции этой буквы.
    // ballX движется от ballStartX к ballFinalX,
    // соответственно правый край = ballX + ballR

    // Нормализуем: при каком moveP правый край достигает lx?
    // Это линейно зависит от того насколько левее finalX от startX.
    // Упрощаем: буква i появляется при moveP = i/(letters.length)
    const revealAt = i / LETTERS.length;
    const lp = clamp((moveP - revealAt) / (1.2 / LETTERS.length), 0, 1);
    const a  = eOut(lp, 3) * alpha;
    if (a < 0.005) return;

    // Буква «выплёскивается» из сферы — стартует с позиции шара
    // и доезжает до своего места
    const startLX = ballX + ballR + fontSize * 0.1;
    const finalLX = lx;
    const curLX   = lerp(startLX, finalLX, eOut(lp, 4));

    // Небольшой вертикальный «выброс»
    const offsetY = lerp(fontSize * 0.18, 0, eOut(lp, 3));

    // Градиент текста
    const gr = ctx.createLinearGradient(textX, 0, textX + LETTERS.length * letterW, 0);
    gr.addColorStop(0,    `rgba(255,200, 20,${a})`);
    gr.addColorStop(0.45, `rgba(240, 30,140,${a})`);
    gr.addColorStop(1,    `rgba(120, 30,255,${a})`);

    ctx.save();
    ctx.globalAlpha = a;
    if (!isMobile) {
      // Многослойная тень для глубины
      ctx.shadowColor = `rgba(220, 20, 150, ${a * 0.75})`;
      ctx.shadowBlur  = fontSize * 0.28;
      ctx.shadowOffsetX = fontSize * 0.018;
      ctx.shadowOffsetY = fontSize * 0.025;
    }
    ctx.fillStyle   = gr;
    ctx.fillText(ch, curLX, textY + offsetY);
    if (!isMobile) {
      // Второй проход — яркий узкий glow
      ctx.shadowColor = `rgba(255,170,  0, ${a * 0.45})`;
      ctx.shadowBlur  = fontSize * 0.07;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
      ctx.fillText(ch, curLX, textY + offsetY);

      // Хроматическая аберрация — только на десктопе
      if (lp > 0.7) {
        const chrA = (lp - 0.7) / 0.3 * a * 0.13;
        const shift = fontSize * 0.009;
        ctx.shadowBlur = 0;
        ctx.fillStyle = `rgba(255,60,60,${chrA})`;
        ctx.globalCompositeOperation = 'screen';
        ctx.fillText(ch, curLX - shift, textY + offsetY);
        ctx.fillStyle = `rgba(60,80,255,${chrA})`;
        ctx.fillText(ch, curLX + shift, textY + offsetY);
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    ctx.restore();
  });

  ctx.restore();
}

/* ─────────────────────────────────────
   ГЛАВНЫЙ ЦИКЛ
───────────────────────────────────── */
let t0 = null, alive = true, prevNow = 0;
let orbitStartTime = -1;   // момент когда moveP достиг 1

function frame(ts) {
  if (!alive) return;
  if (!t0) t0 = ts;
  const now = (ts - t0) / 1000;
  const dt  = Math.min(now - prevNow, 0.05);
  prevNow   = now;

  // Grain удалён

  // Фон
  ctx.fillStyle = '#08070c';
  ctx.fillRect(0, 0, W, H);

  const p = P();

  /* ── Вычисляем состояние каждого элемента ── */

  // Глобальный fade-out
  const globalAlpha = now >= T.HOLD_END
    ? 1 - eIn(prog(now, T.HOLD_END, T.FADE_END), 2)
    : 1;

  // --- ЛИНИЯ ---
  let lineHalfLen = 0;
  let lineAlpha   = 0;

  if (now < T.LINE_IN_END) {
    const t  = eOut(prog(now, 0, T.LINE_IN_END), 4);
    lineHalfLen = p.lineLen * t;
    lineAlpha   = eOut(prog(now, 0, T.LINE_IN_END), 2);

  } else if (now < T.LINE_WAIT_END) {
    const pulse = Math.sin(prog(now, T.LINE_IN_END, T.LINE_WAIT_END) * Math.PI * 2.2);
    lineHalfLen = p.lineLen * (1 + pulse * 0.025);
    lineAlpha   = 1;

  } else if (now < T.STAR_RISE_END) {
    const t = prog(now, T.LINE_WAIT_END, T.STAR_RISE_END);
    lineHalfLen = p.lineLen * lerp(1, 0.88, eIn(t, 2));
    lineAlpha   = 1;

  } else {
    lineHalfLen = p.lineLen * 0.88;
    lineAlpha   = 1;
  }

  // --- СФЕРА ---
  let ballX    = p.ballStartX;
  let ballY    = p.ballY;
  let ballAlpha = 0;
  let moveP    = 0;

  if (now >= T.LINE_WAIT_END && now < T.STAR_RISE_END) {
    const t  = eOut(prog(now, T.LINE_WAIT_END, T.STAR_RISE_END), 3);
    ballX     = p.ballStartX;
    const fromY = p.lineY;
    ballY     = lerp(fromY, p.ballY, t);
    ballAlpha = eOut(prog(now, T.LINE_WAIT_END, T.STAR_RISE_END), 2);
    moveP     = 0;

    // Спавним ripple-волны один раз когда диск начинает подниматься
    if (!rippleSpawned && ballAlpha > 0.08) {
      spawnRipples(ballX, ballY, p.ball);
      rippleSpawned = true;
    }

  } else if (now >= T.STAR_RISE_END) {
    ballAlpha = 1;
    moveP     = eInOut(prog(now, T.STAR_RISE_END, T.STAR_MOVE_END));
    ballX     = lerp(p.ballStartX, p.ballFinalX, moveP);
    ballY     = p.ballY;

    // Фиксируем момент прихода шара на финальную позицию
    if (moveP >= 1 && orbitStartTime < 0) orbitStartTime = now;

    // Микро-пульсация в HOLD-фазе
    if (now >= T.STAR_MOVE_END) {
      const pulse = Math.sin((now - T.STAR_MOVE_END) * Math.PI * 1.8) * 0.012;
      ballY = p.ballY + p.ball * pulse;
    }
  }

  // Обновляем dt (нужен только для совместимости)

  /* ── Рисуем ── */
  ctx.save();
  ctx.globalAlpha = globalAlpha;

  // 0. Точечная сетка (самый нижний слой)
  drawDotGrid(now, globalAlpha);

  // 0b. Scanline sweep при появлении диска (премиум-штрих)
  drawScanlineSweep(now, globalAlpha);

  // Ambient фон под логотипом — только на десктопе
  if (ballAlpha > 0.01 && !isMobile) {
    const ambR = p.totalW * 0.65;
    // В HOLD-фазе ореол тихо дышит
    const holdPulse = now >= T.STAR_MOVE_END
      ? 1 + Math.sin((now - T.STAR_MOVE_END) * Math.PI * 0.9) * 0.07
      : 1;
    const amb = ctx.createRadialGradient(CX, p.ballY + p.ball * 0.1, 0, CX, p.ballY + p.ball * 0.1, ambR * holdPulse);
    amb.addColorStop(0,   `rgba(220, 40, 120, ${ballAlpha * 0.16})`);
    amb.addColorStop(0.5, `rgba(100, 20, 220, ${ballAlpha * 0.09})`);
    amb.addColorStop(1,   `rgba(0, 0, 0, 0)`);
    ctx.fillStyle = amb;
    ctx.beginPath();
    ctx.ellipse(CX, p.ballY + p.ball * 0.2, ambR * holdPulse, ambR * 0.45 * holdPulse, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // 1. Линия
  drawLine(p.lineCX, p.lineY, lineHalfLen, p.lineThick, lineAlpha);

  // 2. Ripple-волны (под текстом и диском)
  drawRipples(now, globalAlpha);

  // 3. Текст
  if (now >= T.STAR_RISE_END) {
    drawText(ballX, p.ball, p.textX, p.textY, p.fontSize, moveP, 1);
  }

  // 4. Диск (поверх текста)
  if (ballAlpha > 0.005) {
    drawBall(ballX, ballY, p.ball, ballAlpha);
  }

  // 4b. Orbit arc + spark (поверх диска)
  if (orbitStartTime > 0) {
    drawOrbitArc(ballX, ballY, p.ball, now - orbitStartTime, globalAlpha);
  }

  // 5. Tagline
  drawTagline(p, now, globalAlpha);

  // 6. Corner marks
  drawCornerMarks(now, globalAlpha);

  ctx.restore();

  if (now < T.FADE_END) {
    requestAnimationFrame(frame);
  } else {
    alive = false;
    ctx.fillStyle = '#08070c';
    ctx.fillRect(0, 0, W, H);
    // window.location.href = '/';
  }
}

requestAnimationFrame(frame);


</script>
