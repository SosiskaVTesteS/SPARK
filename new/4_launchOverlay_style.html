/*
  ══════════════════════════════════════════════════════════════
  SPARK PRELOADER v2 — launchOverlay PATCH
  
  В файле index.html в теге <head> найди блок <style> с:
    #launchOverlay { ... }
    .launch-spinner { ... }
    @keyframes spin { ... }
  
  Замени его целиком на этот код.
  (spinCW уже определён в animations.css — используем его)
  ══════════════════════════════════════════════════════════════
*/

<style>
html.spark-presession #authScreen { display: none !important; }

/* Loading overlay for already-authenticated users */
#launchOverlay {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px;
  transition: opacity 0.5s ease;
}
#launchOverlay.gone { opacity: 0; pointer-events: none; }

/* Iridescent arc spinner — premium upgrade */
.launch-spinner {
  width: 42px; height: 42px; border-radius: 50%;
  background: conic-gradient(
    rgba(155, 95,255,0.00)   0deg,
    rgba(155, 95,255,0.72)  80deg,
    rgba(232, 90,160,0.66) 160deg,
    rgba(232,197, 90,0.50) 240deg,
    rgba( 90,232,197,0.30) 320deg,
    rgba(155, 95,255,0.00) 360deg
  );
  -webkit-mask: radial-gradient(circle, transparent 46%, black 48%);
  mask: radial-gradient(circle, transparent 46%, black 48%);
  animation: spinCW 1.1s linear infinite;
}

/* spinCW is defined in animations.css */

#authScreen:not(.gone) ~ .mob-bar { display: none !important; }
html.auth-active, html.auth-active body { overflow: hidden !important; height: 100% !important; }
</style>
